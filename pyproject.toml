[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-learning-pipeline"
version = "0.1.0"
description = "Automated skill discovery and generation for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "lyon christopher", email = "lyon@hermes-agent.dev"}
]
keywords = ["ai", "agents", "skills", "automation", "github", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
hermes = [
    # Hermes Agent integration (installed separately)
]

[project.scripts]
clp = "clp.cli:main"

[project.urls]
Homepage = "https://github.com/lyonchristopher/continuous-learning-pipeline"
Documentation = "https://github.com/lyonchristopher/continuous-learning-pipeline/docs"
Repository = "https://github.com/lyonchristopher/continuous-learning-pipeline"
Issues = "https://github.com/lyonchristopher/continuous-learning-pipeline/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["clp*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
